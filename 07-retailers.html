<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسوّق من متاجر التجزئة | BOTSHOP-DZ</title>
<meta name="description" content="تصفّح متاجر التجزئة الجزائرية على BOTSHOP-DZ وتسوّق مباشرة عبر واتساب، مع الدفع عند الاستلام أو الدفع الإلكتروني.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#38BDF8; --violet:#7C3AED; --violet-deep:#4C1D95; --ink:#171335;
    --bg:#F8F8FC; --surface:#FFFFFF; --surface-alt:#F1F0FA; --line:#E4E1F4; --muted:#5B5678;
    --gradient: linear-gradient(135deg, var(--blue) 0%, var(--violet) 100%);
    --radius:18px; --shadow:0 20px 50px -20px rgba(76,29,149,.25);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; line-height:1.65; }
  h1,h2,h3{ font-family:'Cairo'; font-weight:800; margin:0; }
  .num{ font-family:'Space Grotesk','IBM Plex Sans Arabic'; direction:ltr; unicode-bidi:isolate; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  .container{ max-width:1140px; margin:0 auto; padding:0 20px; }

  header{ position:sticky; top:0; z-index:40; background:rgba(248,248,252,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; }
  .logo{ display:flex; align-items:center; gap:10px; font-family:'Cairo'; font-weight:900; font-size:1.1rem; }
  .logo-mark{ width:34px; height:34px; border-radius:10px; background:var(--gradient); color:#fff; display:flex; align-items:center; justify-content:center; }
  .nav-links{ display:flex; gap:22px; font-size:.88rem; font-weight:600; color:var(--muted); }
  .nav-links a.active{ color:var(--violet-deep); }

  .page-hero{ background:var(--gradient); color:#fff; padding:44px 0 36px; }
  .page-hero h1{ font-size:1.7rem; margin-bottom:8px; }
  .page-hero p{ opacity:.92; max-width:560px; }

  .toolbar{ display:flex; gap:12px; flex-wrap:wrap; padding:24px 0 18px; }
  .toolbar input, .toolbar select{ padding:11px 14px; border-radius:12px; border:1px solid var(--line); font-family:inherit; font-size:.85rem; background:#fff; }
  .toolbar input{ flex:1; min-width:200px; }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; padding-bottom:18px; }
  .chip{ padding:7px 15px; border-radius:999px; border:1.5px solid var(--line); background:#fff; font-size:.8rem; font-weight:600; color:var(--muted); }
  .chip.active{ background:var(--gradient); color:#fff; border-color:transparent; }

  .stores-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding-bottom:60px; }
  .store-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; transition:transform .18s ease, box-shadow .18s ease; }
  .store-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow); }
  .store-banner{ height:110px; background:linear-gradient(135deg,var(--blue),var(--violet)); display:flex; align-items:center; justify-content:center; font-size:2.2rem; }
  .store-body{ padding:18px; }
  .store-body h3{ font-size:1rem; margin-bottom:4px; }
  .store-meta{ font-size:.78rem; color:var(--muted); margin-bottom:14px; }
  .store-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tag{ background:var(--surface-alt); color:var(--violet-deep); font-size:.7rem; font-weight:700; padding:4px 10px; border-radius:999px; }
  .btn{ padding:10px 14px; border-radius:10px; border:none; font-weight:700; font-size:.82rem; width:100%; background:var(--gradient); color:#fff; }

  .empty-state{ grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted); }
  footer{ padding:30px 0; border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:.82rem; }

  @media (max-width:900px){ .stores-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .stores-grid{ grid-template-columns:1fr; } .nav-links{ display:none; } }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a href="01-landing.html" class="logo"><span class="logo-mark">ب</span> BOTSHOP-DZ</a>
    <nav class="nav-links">
      <a href="06-suppliers.html">الموردون</a>
      <a href="07-retailers.html" class="active">تجار التجزئة</a>
      <a href="08-contracted.html">التجار المتعاقدون</a>
    </nav>
    <a href="02-auth.html?mode=signup&role=retailer" class="btn" style="width:auto;">افتح متجرك</a>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>تسوّق من متاجر التجزئة</h1>
    <p>اكتشف متاجر جزائرية مؤتمتة، وتواصل مباشرة عبر واتساب لإتمام طلبك بالدينار الجزائري.</p>
  </div>
</section>

<div class="container">
  <div class="toolbar">
    <input type="text" id="search-input" placeholder="ابحث عن متجر أو منتج...">
    <select id="wilaya-filter">
      <option value="">كل الولايات</option>
      <option>الجزائر</option><option>وهران</option><option>قسنطينة</option><option>سطيف</option><option>البليدة</option>
    </select>
  </div>
  <div class="chip-row" id="chip-row">
    <button class="chip active" data-cat="">الكل</button>
    <button class="chip" data-cat="أحذية وألبسة">أحذية وألبسة</button>
    <button class="chip" data-cat="إلكترونيات">إلكترونيات</button>
    <button class="chip" data-cat="مستحضرات تجميل">تجميل</button>
    <button class="chip" data-cat="أدوات منزلية">منزلية</button>
  </div>

  <div class="stores-grid" id="stores-grid"></div>
</div>

<footer>© BOTSHOP-DZ — دليل متاجر التجزئة</footer>

<script>
  // بيانات تجريبية — تُستبدل لاحقاً باستعلام Supabase على stores حيث store_type='retailer'
  const stores = [
    { name:'متجر أمين للأحذية', icon:'👟', wilaya:'الجزائر', category:'أحذية وألبسة', href:'04-storefront.html' },
    { name:'بوتيك سارة', icon:'👗', wilaya:'وهران', category:'أحذية وألبسة', href:'04-storefront.html' },
    { name:'التقنية السريعة', icon:'📱', wilaya:'قسنطينة', category:'إلكترونيات', href:'04-storefront.html' },
    { name:'جمال الطبيعة', icon:'💄', wilaya:'سطيف', category:'مستحضرات تجميل', href:'04-storefront.html' },
    { name:'ديكو هوم', icon:'🏠', wilaya:'البليدة', category:'أدوات منزلية', href:'04-storefront.html' },
    { name:'ستايل زون', icon:'👕', wilaya:'الجزائر', category:'أحذية وألبسة', href:'04-storefront.html' },
  ];

  let activeCat = '';
  function renderStores(){
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    const wilaya = document.getElementById('wilaya-filter').value;
    const filtered = stores.filter(s =>
      (!q || s.name.toLowerCase().includes(q)) &&
      (!wilaya || s.wilaya===wilaya) &&
      (!activeCat || s.category===activeCat)
    );
    const grid = document.getElementById('stores-grid');
    if(filtered.length===0){ grid.innerHTML = `<div class="empty-state">🔍 لا توجد متاجر مطابقة لبحثك حالياً</div>`; return; }
    grid.innerHTML = filtered.map(s=>`
      <div class="store-card">
        <div class="store-banner">${s.icon}</div>
        <div class="store-body">
          <h3>${s.name}</h3>
          <div class="store-meta">📍 ${s.wilaya}</div>
          <div class="store-tags"><span class="tag">${s.category}</span></div>
          <a href="${s.href}"><button class="btn">زيارة المتجر</button></a>
        </div>
      </div>`).join('');
  }
  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      renderStores();
    });
  });
  ['search-input','wilaya-filter'].forEach(id=> document.getElementById(id).addEventListener('input', renderStores));
  renderStores();
</script>

</body>
</html>
