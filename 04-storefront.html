<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر | BOTSHOP-DZ</title>
<meta name="description" content="تسوّق من متاجر جزائرية مؤتمتة على BOTSHOP-DZ، مع الدفع عند الاستلام أو الدفع الإلكتروني، وتوصيل إلى كل الولايات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Store",
  "name": "متجر على BOTSHOP-DZ",
  "areaServed": "DZ",
  "priceRange": "1500-8000 DZD"
}
</script>
<style>
  :root{
    --blue:#38BDF8; --violet:#7C3AED; --violet-deep:#4C1D95; --ink:#171335;
    --bg:#F8F8FC; --surface:#FFFFFF; --surface-alt:#F1F0FA; --line:#E4E1F4; --muted:#5B5678;
    --success:#16A34A; --danger:#DC2626;
    --gradient: linear-gradient(135deg, var(--blue) 0%, var(--violet) 100%);
    --radius:18px; --shadow:0 20px 50px -20px rgba(76,29,149,.28);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; line-height:1.65; }
  h1,h2,h3,.display{ font-family:'Cairo'; font-weight:800; margin:0; }
  .num{ font-family:'Space Grotesk','IBM Plex Sans Arabic'; direction:ltr; unicode-bidi:isolate; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  .container{ max-width:1140px; margin:0 auto; padding:0 20px; }

  header{ position:sticky; top:0; z-index:40; background:rgba(248,248,252,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; }
  .store-brand{ display:flex; align-items:center; gap:10px; }
  .store-logo{ width:38px; height:38px; border-radius:11px; background:var(--gradient); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .store-brand b{ font-family:'Cairo'; font-weight:800; }
  .store-brand small{ display:block; color:var(--muted); font-size:.72rem; }
  .cart-btn{
    display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--line);
    padding:9px 16px; border-radius:999px; font-weight:700; font-size:.88rem; position:relative;
  }
  .cart-count{ background:var(--gradient); color:#fff; font-size:.68rem; padding:1px 7px; border-radius:999px; }

  .hero-banner{
    background:var(--gradient); color:#fff; padding:48px 0 40px; position:relative; overflow:hidden;
  }
  .hero-banner::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% 20%, rgba(255,255,255,.2), transparent 45%); }
  .hero-banner .container{ position:relative; z-index:1; display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .hero-avatar{ width:78px; height:78px; border-radius:22px; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:2rem; flex:none; }
  .hero-banner h1{ font-size:1.7rem; margin-bottom:6px; }
  .hero-meta{ display:flex; gap:16px; flex-wrap:wrap; font-size:.85rem; opacity:.92; }
  .hero-meta span{ display:flex; align-items:center; gap:6px; }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; padding:26px 0 18px; flex-wrap:wrap; gap:12px; }
  .toolbar h2{ font-size:1.2rem; }
  .filter-chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ padding:7px 15px; border-radius:999px; border:1.5px solid var(--line); background:#fff; font-size:.82rem; font-weight:600; color:var(--muted); }
  .chip.active{ background:var(--gradient); color:#fff; border-color:transparent; }

  .products-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding-bottom:60px; }
  .product-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; transition:transform .18s ease, box-shadow .18s ease; }
  .product-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow); }
  .product-media{ height:190px; background:linear-gradient(135deg,var(--blue),var(--violet)); position:relative; display:flex; align-items:center; justify-content:center; font-size:2.6rem; }
  .product-media .stock-badge{ position:absolute; top:10px; right:10px; background:rgba(255,255,255,.92); color:var(--ink); font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:999px; }
  .product-body{ padding:16px; }
  .product-body h3{ font-size:.95rem; margin-bottom:6px; }
  .product-price{ display:flex; align-items:baseline; gap:5px; margin-bottom:12px; }
  .product-price .num{ font-size:1.3rem; font-weight:700; color:var(--violet-deep); }
  .product-price .unit{ font-size:.75rem; color:var(--muted); }
  .product-actions{ display:flex; gap:8px; }
  .btn{ padding:10px 14px; border-radius:10px; border:none; font-weight:700; font-size:.85rem; }
  .btn-primary{ background:var(--gradient); color:#fff; flex:1; }
  .btn-ghost{ background:var(--surface-alt); color:var(--ink); }

  /* سلة جانبية */
  .cart-drawer{
    position:fixed; top:0; left:0; height:100%; width:380px; max-width:92vw; background:#fff;
    box-shadow:20px 0 50px -20px rgba(23,19,53,.25); z-index:80; transform:translateX(-100%);
    transition:transform .3s ease; display:flex; flex-direction:column;
  }
  .cart-drawer.open{ transform:translateX(0); }
  .cart-head{ display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); }
  .cart-head h3{ font-size:1.05rem; }
  .close-btn{ background:none; border:none; font-size:1.2rem; color:var(--muted); }
  .cart-items{ flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:14px; }
  .cart-item{ display:flex; gap:12px; align-items:center; }
  .ci-media{ width:52px; height:52px; border-radius:10px; background:linear-gradient(135deg,var(--blue),var(--violet)); flex:none; }
  .ci-info{ flex:1; }
  .ci-info b{ font-size:.85rem; display:block; }
  .ci-info .num{ font-size:.78rem; color:var(--muted); }
  .ci-qty{ display:flex; align-items:center; gap:6px; }
  .ci-qty button{ width:24px; height:24px; border-radius:7px; border:1px solid var(--line); background:#fff; }
  .cart-empty{ text-align:center; color:var(--muted); padding:40px 10px; }
  .cart-foot{ padding:18px 20px; border-top:1px solid var(--line); }
  .cart-total{ display:flex; justify-content:space-between; font-weight:700; margin-bottom:14px; }
  .overlay{ position:fixed; inset:0; background:rgba(23,19,53,.35); z-index:70; opacity:0; pointer-events:none; transition:opacity .3s ease; }
  .overlay.show{ opacity:1; pointer-events:auto; }

  /* نافذة الدفع */
  .modal{ position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease; padding:20px; }
  .modal.show{ opacity:1; pointer-events:auto; }
  .modal-box{ background:#fff; border-radius:22px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:26px; }
  .modal-box h3{ font-size:1.2rem; margin-bottom:18px; }
  .field-group{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field-group label{ font-size:.85rem; font-weight:700; }
  input, select{ padding:11px 13px; border-radius:10px; border:1.5px solid var(--line); font-family:inherit; font-size:.88rem; outline:none; }
  input:focus, select:focus{ border-color:var(--violet); box-shadow:0 0 0 3px rgba(124,58,237,.12); }

  .pay-options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
  .pay-opt{ border:1.5px solid var(--line); border-radius:12px; padding:12px; display:flex; align-items:center; gap:8px; font-size:.82rem; font-weight:700; cursor:pointer; }
  .pay-opt input{ width:auto; }
  .pay-opt.selected{ border-color:var(--violet); background:rgba(124,58,237,.06); }

  .discount-box{ display:flex; gap:8px; margin-bottom:14px; }
  .discount-box input{ flex:1; }
  .discount-box button{ padding:0 16px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-weight:700; font-size:.82rem; }
  .discount-applied{ display:none; background:var(--surface-alt); color:var(--success); font-size:.8rem; font-weight:700; padding:8px 12px; border-radius:10px; margin-bottom:14px; }
  .discount-applied.show{ display:block; }

  .summary-row{ display:flex; justify-content:space-between; font-size:.88rem; padding:6px 0; }
  .summary-row.total{ font-weight:800; font-size:1.05rem; border-top:1px solid var(--line); margin-top:6px; padding-top:12px; }

  .success-view{ text-align:center; padding:20px 6px; }
  .success-ic{ width:64px; height:64px; border-radius:50%; background:var(--gradient); color:#fff; font-size:1.8rem; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }

  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:13px 18px;
    border-radius:12px; font-size:.85rem; box-shadow:var(--shadow); transform:translateY(120%);
    transition:transform .3s ease; z-index:100;
  }
  .toast.show{ transform:translateY(0); }

  footer{ padding:30px 0; border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:.82rem; }

  @media (max-width:800px){ .products-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:520px){ .products-grid{ grid-template-columns:1fr; } .pay-options{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <div class="store-brand">
      <div class="store-logo">🏪</div>
      <div><b id="store-name-label">جارٍ التحميل...</b><small id="store-sub-label">—</small></div>
    </div>
    <button class="cart-btn" id="cart-toggle">🛒 السلة <span class="cart-count" id="cart-count">0</span></button>
  </div>
</header>

<section class="hero-banner">
  <div class="container">
    <div class="hero-avatar">🏪</div>
    <div>
      <h1 id="store-name-hero">—</h1>
      <div class="hero-meta">
        <span>🚚 توصيل لجميع الولايات</span>
        <span>💳 دفع عند الاستلام أو إلكتروني</span>
        <a id="wa-direct-btn" href="#" target="_blank" style="display:none; align-items:center; gap:6px; background:#25D366; color:#fff; padding:6px 14px; border-radius:999px; font-weight:700; text-decoration:none;">💬 راسلنا واتساب مباشرة</a>
      </div>
    </div>
  </div>
</section>

<div class="container">
  <div class="toolbar">
    <h2>منتجاتنا</h2>
  </div>

  <div class="products-grid" id="products-grid"></div>
</div>

<!-- سلة جانبية -->
<div class="overlay" id="overlay"></div>
<aside class="cart-drawer" id="cart-drawer">
  <div class="cart-head"><h3>سلة الطلب</h3><button class="close-btn" id="cart-close">✕</button></div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-foot">
    <div class="cart-total"><span>المجموع</span><span class="num" id="cart-total">0 دج</span></div>
    <button class="btn btn-primary" style="width:100%;" id="checkout-btn">إتمام الطلب</button>
  </div>
</aside>

<!-- نافذة إتمام الطلب -->
<div class="modal" id="checkout-modal">
  <div class="modal-box">
    <div id="checkout-form-view">
      <h3>إتمام الطلب</h3>
      <form id="checkout-form" novalidate>
        <div class="field-group">
          <label for="c-name">الاسم الكامل</label>
          <input type="text" id="c-name" required>
        </div>
        <div class="field-group">
          <label for="c-phone">رقم الهاتف</label>
          <input type="tel" id="c-phone" placeholder="05XXXXXXXX" pattern="0[5-7][0-9]{8}" required>
        </div>
        <div class="field-group">
          <label for="c-address">العنوان التفصيلي (الحي، الشارع)</label>
          <input type="text" id="c-address" placeholder="مثال: حي باب الزوار، شارع الإخوة بوعضو" required>
        </div>

        <div class="field-group">
          <label for="c-wilaya-select">الولاية</label>
          <select id="c-wilaya-select" required>
            <option value="" disabled selected>اختر ولايتك</option>
            <option>الجزائر</option><option>وهران</option><option>قسنطينة</option>
            <option>سطيف</option><option>عنابة</option><option>باتنة</option>
            <option>بليدة</option><option>تلمسان</option><option>بجاية</option>
            <option>ولاية أخرى</option>
          </select>
        </div>

        <div class="field-group">
          <label>وسيلة الدفع</label>
          <div class="pay-options" id="pay-options">
            <label class="pay-opt selected"><input type="radio" name="pay" value="cod" checked> 💵 عند الاستلام</label>
            <label class="pay-opt"><input type="radio" name="pay" value="baridimob"> 📱 BaridiMob</label>
            <label class="pay-opt"><input type="radio" name="pay" value="ccp"> 🏦 CCP</label>
            <label class="pay-opt"><input type="radio" name="pay" value="cib_chargily"> 💳 CIB</label>
          </div>
        </div>

        <div class="field-group">
          <label for="c-discount">كود الإحالة / الخصم (اختياري)</label>
          <div class="discount-box">
            <input type="text" id="c-discount" placeholder="مثال: FRIEND100">
            <button type="button" id="apply-discount">تطبيق</button>
          </div>
          <div class="discount-applied" id="discount-applied"></div>
        </div>

        <div class="summary-row"><span>المنتجات</span><span class="num" id="sum-products">0 دج</span></div>
        <div class="summary-row"><span>الخصم</span><span class="num" id="sum-discount">0 دج</span></div>
        <div class="summary-row total"><span>الإجمالي</span><span class="num" id="sum-total">0 دج</span></div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;" id="checkout-submit-btn">تأكيد الطلب</button>
      </form>
    </div>

    <div id="checkout-success-view" style="display:none;">
      <div class="success-view">
        <div class="success-ic">✓</div>
        <h3 style="margin-bottom:8px;">تم تأكيد طلبك 🎉</h3>
        <p style="color:var(--muted); font-size:.9rem;">رقم طلبك <b class="num" id="success-order-id"></b>. سيصلك تحديث حالة الشحن عبر واتساب.</p>
        <button class="btn btn-primary" style="margin-top:18px;" id="close-success">حسناً</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer>© BOTSHOP-DZ — مدعوم بمنصة BOTSHOP-DZ</footer>

<script>
  // ==========================================================================
  // تحديد المتجر المطلوب عرضه عبر رابط الصفحة، مثال:
  // 04-storefront.html?store=UUID-الخاص-بالمتجر
  // ==========================================================================
  const params = new URLSearchParams(location.search);
  const storeId = params.get('store');

  let currentStoreRow = null;
  let products = [];
  let cart = []; // { id, name, price, qty }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2600);
  }

  // تحويل رقم هاتف جزائري محلي (05/06/07XXXXXXXX) إلى صيغة دولية لروابط wa.me
  function toWhatsAppNumber(localPhone){
    if(!localPhone) return null;
    const digits = localPhone.replace(/\D/g, '');
    return digits.startsWith('0') ? '213' + digits.slice(1) : digits;
  }

  async function loadStoreAndProducts(){
    if(!storeId){
      document.getElementById('store-name-hero').textContent = 'لم يُحدَّد متجر';
      document.getElementById('store-name-label').textContent = 'رابط غير صحيح';
      document.getElementById('store-sub-label').textContent = 'أضف ?store=معرّف_المتجر لرابط هذه الصفحة';
      return;
    }

    const { data: store, error } = await sb.from('stores')
      .select('*, profiles(store_name, wilaya, phone)').eq('id', storeId).single();

    if(error || !store){
      document.getElementById('store-name-hero').textContent = 'المتجر غير موجود';
      showToast('تعذّر العثور على هذا المتجر');
      return;
    }

    currentStoreRow = store;
    const name = store.profiles?.store_name || 'متجر بدون اسم';
    document.getElementById('store-name-label').textContent = name;
    document.getElementById('store-sub-label').textContent = store.profiles?.wilaya || '';
    document.getElementById('store-name-hero').textContent = name;
    document.title = name + ' | BOTSHOP-DZ';

    const waNumber = toWhatsAppNumber(store.profiles?.phone);
    if(waNumber){
      const waBtn = document.getElementById('wa-direct-btn');
      waBtn.href = `https://wa.me/${waNumber}?text=${encodeURIComponent('السلام عليكم، عندي سؤال عن منتجاتكم في ' + name)}`;
      waBtn.style.display = 'inline-flex';
    }

    const { data: productsData, error: productsError } = await sb.from('products')
      .select('*').eq('store_id', storeId).eq('is_active', true).order('created_at', { ascending:false });
    if(productsError){ showToast('تعذّر تحميل المنتجات: ' + productsError.message); return; }
    products = productsData || [];
    renderProducts();
  }

  // ---------- عرض المنتجات ----------
  function renderProducts(){
    const grid = document.getElementById('products-grid');
    if(products.length === 0){
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px 20px; color:var(--muted);">لا توجد منتجات معروضة في هذا المتجر بعد</div>`;
      return;
    }
    grid.innerHTML = products.map(p=>`
      <div class="product-card">
        <div class="product-media">📦<span class="stock-badge">${p.stock} متوفر</span></div>
        <div class="product-body">
          <h3>${p.title}</h3>
          <div class="product-price"><span class="num">${Number(p.price).toLocaleString('en-US')}</span><span class="unit">دج</span></div>
          <div class="product-actions">
            <button class="btn btn-primary" ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}')">${p.stock<=0?'نفدت الكمية':'أضف للسلة'}</button>
          </div>
        </div>
      </div>`).join('');
  }

  // ---------- السلة ----------
  function addToCart(id){
    const p = products.find(x=>x.id===id);
    if(!p) return;
    const existing = cart.find(x=>x.id===id);
    if(existing){ existing.qty++; } else { cart.push({ id:p.id, name:p.title, price:Number(p.price), qty:1 }); }
    renderCart();
    showToast(`أُضيف "${p.title}" إلى السلة`);
    openCart();
  }
  function changeQty(id, delta){
    const item = cart.find(x=>x.id===id);
    item.qty += delta;
    if(item.qty <= 0) cart = cart.filter(x=>x.id!==id);
    renderCart();
  }
  function cartSubtotal(){ return cart.reduce((s,i)=>s+i.price*i.qty,0); }

  function renderCart(){
    const wrap = document.getElementById('cart-items');
    document.getElementById('cart-count').textContent = cart.reduce((s,i)=>s+i.qty,0);
    if(cart.length === 0){
      wrap.innerHTML = `<div class="cart-empty">🛒<br>سلتك فارغة حالياً</div>`;
    } else {
      wrap.innerHTML = cart.map(i=>`
        <div class="cart-item">
          <div class="ci-media"></div>
          <div class="ci-info"><b>${i.name}</b><span class="num">${i.price.toLocaleString('en-US')} دج</span></div>
          <div class="ci-qty">
            <button onclick="changeQty('${i.id}',-1)">−</button>
            <span class="num">${i.qty}</span>
            <button onclick="changeQty('${i.id}',1)">+</button>
          </div>
        </div>`).join('');
    }
    document.getElementById('cart-total').textContent = cartSubtotal().toLocaleString('en-US') + ' دج';
  }

  const cartDrawer = document.getElementById('cart-drawer');
  const overlay = document.getElementById('overlay');
  function openCart(){ cartDrawer.classList.add('open'); overlay.classList.add('show'); }
  function closeCart(){ cartDrawer.classList.remove('open'); overlay.classList.remove('show'); }
  document.getElementById('cart-toggle').addEventListener('click', openCart);
  document.getElementById('cart-close').addEventListener('click', closeCart);
  overlay.addEventListener('click', ()=>{ closeCart(); closeCheckout(); });

  // ---------- وسائل الدفع ----------
  document.querySelectorAll('.pay-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      document.querySelectorAll('.pay-opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
    });
  });

  // ---------- كود الخصم — ملاحظة: عرض تقديري فقط حالياً، غير موثّق بعد في جدول referrals ----------
  function discountForAmount(amount){
    if(amount < 2000) return 100;
    if(amount <= 5000) return 200;
    if(amount <= 10000) return 300;
    if(amount <= 15000) return 400;
    return 500;
  }
  let appliedDiscount = 0;
  document.getElementById('apply-discount').addEventListener('click', ()=>{
    const code = document.getElementById('c-discount').value.trim();
    const box = document.getElementById('discount-applied');
    if(!code){ box.classList.remove('show'); appliedDiscount = 0; updateSummary(); return; }
    appliedDiscount = discountForAmount(cartSubtotal());
    box.textContent = `✓ تم تطبيق خصم تقديري بقيمة ${appliedDiscount} دج (لم يُوثَّق بعد كإحالة فعلية)`;
    box.classList.add('show');
    updateSummary();
  });

  function updateSummary(){
    const sub = cartSubtotal();
    document.getElementById('sum-products').textContent = sub.toLocaleString('en-US') + ' دج';
    document.getElementById('sum-discount').textContent = '−' + appliedDiscount.toLocaleString('en-US') + ' دج';
    document.getElementById('sum-total').textContent = Math.max(sub - appliedDiscount,0).toLocaleString('en-US') + ' دج';
  }

  // ---------- نافذة إتمام الطلب ----------
  const checkoutModal = document.getElementById('checkout-modal');
  document.getElementById('checkout-btn').addEventListener('click', ()=>{
    if(cart.length === 0){ showToast('السلة فارغة — أضف منتجاً أولاً'); return; }
    updateSummary();
    checkoutModal.classList.add('show'); overlay.classList.add('show');
  });
  function closeCheckout(){ checkoutModal.classList.remove('show'); }
  document.getElementById('close-success').addEventListener('click', ()=>{
    closeCheckout(); overlay.classList.remove('show');
    document.getElementById('checkout-form-view').style.display='block';
    document.getElementById('checkout-success-view').style.display='none';
  });

  // ---------- تأكيد الطلب الحقيقي (دخول مجهول + إدراج في profiles وorders) ----------
  document.getElementById('checkout-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const form = e.target;
    if(!form.checkValidity()){ form.reportValidity(); return; }
    if(!currentStoreRow){ showToast('لم يُحدَّد متجر صالح لهذا الرابط'); return; }

    const btn = document.getElementById('checkout-submit-btn');
    btn.disabled = true; btn.textContent = 'جارٍ إرسال الطلب...';

    const fullName = document.getElementById('c-name').value.trim();
    const phone = document.getElementById('c-phone').value.trim();
    const wilaya = document.getElementById('c-wilaya-select').value;
    const address = document.getElementById('c-address').value.trim();
    const payMethod = document.querySelector('input[name="pay"]:checked').value;

    // 1) الحصول على جلسة (دخول مجهول إن لم توجد جلسة أصلاً)
    let { data: { session } } = await sb.auth.getSession();
    if(!session){
      const { data: anonData, error: anonError } = await sb.auth.signInAnonymously();
      if(anonError){ showToast('تعذّر بدء الطلب: ' + anonError.message); btn.disabled=false; btn.textContent='تأكيد الطلب'; return; }
      session = anonData.session;
    }

    // 2) التأكد من وجود ملف شخصي لهذا العميل (يُنشأ تلقائياً عند أول طلب)
    const { data: existingProfile } = await sb.from('profiles').select('id').eq('id', session.user.id).maybeSingle();
    if(!existingProfile){
      const { error: profileError } = await sb.from('profiles').insert({
        id: session.user.id, role: 'customer', full_name: fullName, phone, wilaya
      });
      if(profileError){ showToast('تعذّر حفظ بياناتك: ' + profileError.message); btn.disabled=false; btn.textContent='تأكيد الطلب'; return; }
    }

    // 3) إنشاء الطلب (مبدئياً لأول منتج في السلة — دعم تعدد المنتجات بطلبات منفصلة يحتاج تطويراً لاحقاً)
    const firstItem = cart[0];
    const { data: newOrder, error: orderError } = await sb.from('orders').insert({
      store_id: currentStoreRow.id,
      customer_id: session.user.id,
      product_id: firstItem.id,
      quantity: firstItem.qty,
      total_product_price: Math.max(cartSubtotal() - appliedDiscount, 0),
      shipping_address: address,
      payment_method: payMethod
    }).select().single();

    btn.disabled = false; btn.textContent = 'تأكيد الطلب';

    if(orderError){ showToast('تعذّر إتمام الطلب: ' + orderError.message); return; }

    document.getElementById('success-order-id').textContent = newOrder.order_number || newOrder.id;
    document.getElementById('checkout-form-view').style.display='none';
    document.getElementById('checkout-success-view').style.display='block';
    cart = []; appliedDiscount = 0; renderCart(); closeCart();
  });

  loadStoreAndProducts();
  renderCart();
</script>

</body>
</html>
