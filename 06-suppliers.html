<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل الموردين | بيع بالجملة في الجزائر | BOTSHOP-DZ</title>
<meta name="description" content="تصفّح دليل الموردين المعتمدين على BOTSHOP-DZ للبيع بالجملة في الجزائر، وابدأ عقد توريد مع مورّد يناسب نشاطك التجاري.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#38BDF8; --violet:#7C3AED; --violet-deep:#4C1D95; --ink:#171335;
    --bg:#F8F8FC; --surface:#FFFFFF; --surface-alt:#F1F0FA; --line:#E4E1F4; --muted:#5B5678;
    --success:#16A34A;
    --gradient: linear-gradient(135deg, var(--blue) 0%, var(--violet) 100%);
    --radius:18px; --shadow:0 20px 50px -20px rgba(76,29,149,.25);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; line-height:1.65; }
  h1,h2,h3{ font-family:'Cairo'; font-weight:800; margin:0; }
  .num{ font-family:'Space Grotesk','IBM Plex Sans Arabic'; direction:ltr; unicode-bidi:isolate; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  .container{ max-width:1140px; margin:0 auto; padding:0 20px; }

  header{ position:sticky; top:0; z-index:40; background:rgba(248,248,252,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; }
  .logo{ display:flex; align-items:center; gap:10px; font-family:'Cairo'; font-weight:900; font-size:1.1rem; }
  .logo-mark{ width:34px; height:34px; border-radius:10px; background:var(--gradient); color:#fff; display:flex; align-items:center; justify-content:center; }
  .nav-links{ display:flex; gap:22px; font-size:.88rem; font-weight:600; color:var(--muted); }
  .nav-links a.active{ color:var(--violet-deep); }

  .page-hero{ background:var(--gradient); color:#fff; padding:44px 0 36px; }
  .page-hero h1{ font-size:1.7rem; margin-bottom:8px; }
  .page-hero p{ opacity:.92; max-width:560px; }

  .toolbar{ display:flex; gap:12px; flex-wrap:wrap; padding:24px 0 18px; }
  .toolbar input, .toolbar select{ padding:11px 14px; border-radius:12px; border:1px solid var(--line); font-family:inherit; font-size:.85rem; background:#fff; }
  .toolbar input{ flex:1; min-width:200px; }

  .suppliers-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding-bottom:60px; }
  .supplier-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; transition:transform .18s ease, box-shadow .18s ease; }
  .supplier-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow); }
  .supplier-banner{ height:80px; background:linear-gradient(135deg,var(--blue),var(--violet)); position:relative; }
  .supplier-avatar{ width:56px; height:56px; border-radius:16px; background:#fff; border:3px solid #fff; box-shadow:var(--shadow); position:absolute; bottom:-24px; right:20px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
  .supplier-body{ padding:34px 20px 20px; }
  .supplier-body h3{ font-size:1rem; margin-bottom:4px; }
  .supplier-meta{ font-size:.78rem; color:var(--muted); margin-bottom:12px; }
  .supplier-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tag{ background:var(--surface-alt); color:var(--violet-deep); font-size:.7rem; font-weight:700; padding:4px 10px; border-radius:999px; }
  .verified{ display:inline-flex; align-items:center; gap:4px; font-size:.72rem; color:var(--success); font-weight:700; }
  .supplier-actions{ display:flex; gap:8px; }
  .btn{ padding:10px 14px; border-radius:10px; border:none; font-weight:700; font-size:.82rem; }
  .btn-primary{ background:var(--gradient); color:#fff; flex:1; }
  .btn-ghost{ background:var(--surface-alt); color:var(--ink); }

  .empty-state{ grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted); }

  footer{ padding:30px 0; border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:.82rem; }

  @media (max-width:900px){ .suppliers-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .suppliers-grid{ grid-template-columns:1fr; } .nav-links{ display:none; } }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a href="01-landing.html" class="logo"><span class="logo-mark">ب</span> BOTSHOP-DZ</a>
    <nav class="nav-links">
      <a href="06-suppliers.html" class="active">الموردون</a>
      <a href="07-retailers.html">تجار التجزئة</a>
      <a href="08-contracted.html">التجار المتعاقدون</a>
    </nav>
    <a href="02-auth.html?mode=signup&role=supplier" class="btn btn-primary">سجّل كمورّد</a>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>دليل الموردين المعتمدين</h1>
    <p>تصفّح موردي الجملة على BOTSHOP-DZ، وابدأ عقد توريد شرعي مع من يناسب نشاطك — كتاجر تجزئة أو تاجر متعاقد.</p>
  </div>
</section>

<div class="container">
  <div class="toolbar">
    <input type="text" id="search-input" placeholder="ابحث عن مورّد أو فئة منتجات...">
    <select id="wilaya-filter">
      <option value="">كل الولايات</option>
      <option>الجزائر</option><option>وهران</option><option>قسنطينة</option><option>سطيف</option><option>البليدة</option>
    </select>
    <select id="category-filter">
      <option value="">كل الفئات</option>
      <option>أحذية وألبسة</option>
      <option>إلكترونيات</option>
      <option>مستحضرات تجميل</option>
      <option>أدوات منزلية</option>
    </select>
  </div>

  <div class="suppliers-grid" id="suppliers-grid"></div>
</div>

<footer>© BOTSHOP-DZ — دليل الموردين المعتمدين</footer>

<script>
  // بيانات تجريبية لعرض دليل الموردين — تُستبدل لاحقاً باستعلام Supabase
  // على stores حيث store_type = 'supplier'
  const suppliers = [
    { name:'مؤسسة الوادي للجملة', icon:'📦', wilaya:'الجزائر', category:'أحذية وألبسة', products:'أكثر من 40 منتجاً', plan:'مؤسساتية' },
    { name:'مخزن الشرق للجملة', icon:'🧴', wilaya:'قسنطينة', category:'مستحضرات تجميل', products:'أكثر من 25 منتجاً', plan:'أساسية' },
    { name:'التقنية الحديثة جملة', icon:'📱', wilaya:'وهران', category:'إلكترونيات', products:'أكثر من 60 منتجاً', plan:'احترافية' },
    { name:'بيت الأناقة للجملة', icon:'👗', wilaya:'البليدة', category:'أحذية وألبسة', products:'أكثر من 30 منتجاً', plan:'احترافية' },
    { name:'دار المنزل للأدوات', icon:'🏠', wilaya:'سطيف', category:'أدوات منزلية', products:'أكثر من 18 منتجاً', plan:'أساسية' },
    { name:'الجزائر تك للجملة', icon:'🔌', wilaya:'الجزائر', category:'إلكترونيات', products:'أكثر من 50 منتجاً', plan:'مؤسساتية' },
  ];

  function renderSuppliers(){
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    const wilaya = document.getElementById('wilaya-filter').value;
    const cat = document.getElementById('category-filter').value;

    const filtered = suppliers.filter(s =>
      (!q || s.name.toLowerCase().includes(q) || s.category.toLowerCase().includes(q)) &&
      (!wilaya || s.wilaya===wilaya) &&
      (!cat || s.category===cat)
    );

    const grid = document.getElementById('suppliers-grid');
    if(filtered.length===0){
      grid.innerHTML = `<div class="empty-state">🔍 لا يوجد موردون مطابقون لبحثك حالياً</div>`;
      return;
    }
    grid.innerHTML = filtered.map(s=>`
      <div class="supplier-card">
        <div class="supplier-banner"><div class="supplier-avatar">${s.icon}</div></div>
        <div class="supplier-body">
          <h3>${s.name}</h3>
          <div class="supplier-meta">📍 ${s.wilaya} · <span class="verified">✅ موثّق</span></div>
          <div class="supplier-tags"><span class="tag">${s.category}</span><span class="tag">${s.products}</span></div>
          <div class="supplier-actions">
            <button class="btn btn-primary" onclick="alert('سيتم فتح نموذج طلب عقد توريد مع ${s.name} — راجع صفحة التجار المتعاقدين')">اطلب عقد توريد</button>
            <button class="btn btn-ghost">التفاصيل</button>
          </div>
        </div>
      </div>`).join('');
  }
  ['search-input','wilaya-filter','category-filter'].forEach(id=>{
    document.getElementById(id).addEventListener('input', renderSuppliers);
  });
  renderSuppliers();
</script>

</body>
</html>
